<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop</title>
<meta name="theme-color" content="#100F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drop">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100F17; --panel:#191826; --panel-2:#211F31; --line:#2E2C41;
  --text:#EDEBF5; --dim:#9895B0; --accent:#5FD8E8;
}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--bg);}
body{
  color:var(--text); font-family:'Space Grotesk',system-ui,sans-serif; font-size:15px; line-height:1.5;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(44px + env(safe-area-inset-bottom));
  max-width:720px; margin:0 auto; -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid #6FD98A; outline-offset:2px;}

.tabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:12px; margin-bottom:20px;}
.tabs button{flex:1; background:none; border:0; padding:9px; border-radius:9px; font-size:14px; font-weight:500; color:var(--dim);}
.tabs button.on{background:var(--panel-2); color:var(--text);}
.tabs em{font-style:normal; font-family:'JetBrains Mono',monospace; font-size:11px; margin-left:5px; color:#6FD98A;}

.hero{position:relative; width:100%; border:0; border-radius:20px; padding:30px 20px 26px;
  background:linear-gradient(150deg,#3B2E6E 0%,#5B3A86 45%,#8A4A7A 100%);
  color:#fff; text-align:center; overflow:hidden;
  box-shadow:0 14px 34px -14px rgba(138,74,122,.75), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .12s ease;}
.hero:active{transform:scale(.975);}
.hero strong{display:block; font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1.05;}
.hero small{display:block; margin-top:7px; font-size:14px; color:rgba(255,255,255,.72);}
.hero .glow{position:absolute; inset:-60% -20% auto; height:180px;
  background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.35),transparent 70%);
  animation:breathe 4.5s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.55;} 50%{opacity:1;}}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:11px;}
.pill{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 13px;
  text-align:left; color:var(--text); transition:transform .12s, border-color .12s;}
.pill:active{transform:scale(.97);}
.pill strong{display:block; font-size:16px; font-weight:500;}
.pill small{display:block; margin-top:2px; font-size:12px; color:var(--dim); font-family:'JetBrains Mono',monospace;}
.note{margin:16px 0 12px; font-size:13px; color:var(--dim); text-align:center;}
.link{display:block; margin:0 auto; background:none; border:0; color:var(--dim); font-size:13px;
  text-decoration:underline; text-underline-offset:3px;}
.kit,.keyin{width:100%; margin-top:10px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; padding:11px; color:var(--text); font-family:inherit; font-size:14px; resize:vertical; line-height:1.45;}
.error{margin-top:16px; background:rgba(240,106,170,.1); border:1px solid rgba(240,106,170,.35);
  border-radius:12px; padding:11px 13px; font-size:14px; color:#F7A9CD;}

.rolling{padding:60px 0; text-align:center;}
.reel{height:34px; overflow:hidden; margin-bottom:14px;}
.reel span{display:block; height:34px; font-size:24px; font-weight:700; letter-spacing:-.02em;
  animation:spin 1.1s cubic-bezier(.5,0,.5,1) infinite;}
@keyframes spin{from{transform:translateY(0);} to{transform:translateY(-238px);}}
.rolling p{margin:0; font-size:13px; color:var(--dim); font-family:'JetBrains Mono',monospace;}

.card{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:18px 16px 0; margin-bottom:14px; overflow:hidden;}
.card::before{content:''; position:absolute; inset:0 0 auto; height:3px; background:var(--accent);}
.card::after{content:''; position:absolute; inset:-40% -30% auto; height:220px; pointer-events:none;
  background:radial-gradient(ellipse at 50% 0,var(--accent),transparent 68%); opacity:.13;}
.shine{position:absolute; top:0; bottom:0; width:45%; pointer-events:none; z-index:2; left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);}
.reveal .shine{animation:sweep .85s ease-out .18s 1;}
@keyframes sweep{from{left:-60%;} to{left:130%;}}
.card-top{position:relative; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.tag{font-size:11px; font-weight:500; letter-spacing:.03em; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:3px 10px;}
.badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.flavor{font-size:11px; font-weight:500; color:var(--dim); background:var(--panel-2);
  border-radius:999px; padding:4px 10px;}
.hours{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); white-space:nowrap;}
.card h2{position:relative; margin:0; font-size:27px; font-weight:700; letter-spacing:-.025em; line-height:1.12;}
.pitch{position:relative; margin:8px 0 0; font-size:15px; color:var(--dim); max-width:52ch;}
.body{position:relative; margin-top:18px;}
.payoff{margin:0 0 16px; font-size:15px; padding-left:12px; border-left:2px solid var(--accent);}
.body section{margin-bottom:16px;}
.body h3{margin:0 0 7px; font-size:11px; font-weight:500; letter-spacing:.05em; color:var(--dim); font-family:'JetBrains Mono',monospace;}
.parts{margin:0; padding-left:16px; font-size:14px; color:#D3D0E2;}
.parts li{margin-bottom:4px;}
.steps{margin:0; padding-left:19px; font-size:14px; color:#D3D0E2;}
.steps li{margin-bottom:7px; padding-left:3px;}
.steps li::marker{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent);}
.gotcha{background:var(--panel-2); border-radius:12px; padding:12px 13px; font-size:14px; margin:0 0 16px;}
.gotcha span{display:block; font-size:11px; color:var(--dim); margin-bottom:4px; font-family:'JetBrains Mono',monospace;}
.actions{position:relative; display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 18px;}
.actions button{flex:1; min-width:96px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:11px; padding:11px 14px; font-size:14px; font-weight:500; color:var(--text); transition:transform .12s;}
.actions button:active{transform:scale(.97);}
.actions .primary{background:var(--accent); border-color:var(--accent); color:#14121C;}
.actions .ghost{color:var(--dim); background:none;}

.rarity{position:relative; display:flex; align-items:center; justify-content:space-between;
  margin:0 -16px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel-2);}
.pips{display:flex; gap:5px;}
.pips span{width:22px; height:5px; border-radius:3px; background:var(--line);}
.pips span.on{background:var(--accent); box-shadow:0 0 9px var(--accent);}
.rarity p{margin:0; font-size:12px; font-weight:500; letter-spacing:.04em; color:var(--accent); font-family:'JetBrains Mono',monospace;}

.reveal{animation:pop .42s cubic-bezier(.18,.9,.28,1.08);}
@keyframes pop{from{transform:scale(.92) translateY(16px); opacity:0;} to{transform:none; opacity:1;}}
.reveal .payoff,.reveal .body section,.reveal .gotcha,.reveal .actions{animation:rise .4s ease-out backwards;}
.reveal .payoff{animation-delay:.16s;}
.reveal .body section:nth-of-type(1){animation-delay:.22s;}
.reveal .body section:nth-of-type(2){animation-delay:.28s;}
.reveal .gotcha{animation-delay:.32s;}
.reveal .body section:nth-of-type(3){animation-delay:.36s;}
.reveal .actions{animation-delay:.4s;}
@keyframes rise{from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;}}

.work{position:relative; padding:16px 0 18px;}
.next{display:block; margin-bottom:10px;}
.next span{display:block; font-size:11px; color:var(--dim); margin-bottom:5px; font-family:'JetBrains Mono',monospace; letter-spacing:.05em;}
input[type=text]{width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:11px;
  padding:10px 12px; color:var(--text); font-family:inherit; font-size:16px;}
input::placeholder, textarea::placeholder{color:#6F6C87;}
.logline{display:flex; gap:7px;}
.logline button{background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:0 15px; color:var(--dim); font-size:13px;}
.log{list-style:none; margin:12px 0 0; padding:0; font-size:13px;}
.log li{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); color:#C9C6DC;}
.log time{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--accent); flex:0 0 48px; padding-top:2px;}
.route{margin:14px 0;}
.route summary{font-size:13px; color:var(--dim); cursor:pointer;}
.route ol{margin-top:11px;}
.empty{padding:50px 0; text-align:center; color:var(--dim); font-size:14px;}

.stub{display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--panel);
  border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
.stub.parked{opacity:.62;}
.stub h2{margin:0; font-size:17px; font-weight:500; letter-spacing:-.01em;}
.stub p{margin:3px 0 0; font-size:12px; color:var(--dim);}
.stub button{background:none; border:1px solid var(--line); border-radius:9px; padding:7px 12px; color:var(--dim); font-size:13px; white-space:nowrap;}
.offline{background:var(--panel-2); border-radius:12px; padding:11px 13px; font-size:13px; color:var(--dim); margin-top:16px;}

@media (min-width:620px){
  body{padding:22px 24px 54px;}
  .grid{grid-template-columns:repeat(4,1fr);}
  .card{padding:22px 20px 0;}
  .rarity{margin:0 -20px; padding:13px 20px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
  .shine{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ data ============================ */
const SCOPES = [
  {id:"daily",   label:"Daily drop", hint:"one sitting",   brief:"2 to 4 hours, finished in one sitting tonight", diff:[1,3]},
  {id:"weekend", label:"Weekend",    hint:"two days",      brief:"two days, with a night to sleep on it", diff:[2,4]},
  {id:"weekly",  label:"Weekly",     hint:"evenings",      brief:"one week of evenings, 10 to 15 hours total", diff:[2,5]},
  {id:"quick",   label:"Quick hit",  hint:"under an hour", brief:"45 minutes, one idea, one file, done", diff:[1,2]},
  {id:"epic",    label:"Long haul",  hint:"weeks",         brief:"three to six weeks, ambitious, worth showing people", diff:[3,5]}
];
const DOMAINS = [
  {id:"software",    label:"Software",      color:"#5FD8E8"},
  {id:"electronics", label:"Electronics",   color:"#F5A742"},
  {id:"embedded",    label:"Embedded",      color:"#A98BF5"},
  {id:"cad",         label:"CAD & print",   color:"#FF8163"},
  {id:"signals",     label:"Data & signals",color:"#6FD98A"},
  {id:"biomed",      label:"Bio & medical", color:"#F06AAA"},
  {id:"wildcard",    label:"Wildcard",      color:"#E3C25C"}
];
const TIERS = ["Warm-up","Steady","Tricky","Hard","Brutal"];

// Why this project exists. Weighted — learning stays the most common roll.
const INTENTS = [
  {id:"learn",   label:"To learn",   weight:38,
   line:"Point of it: teach them one concrete technique they don't have yet. The technique is the reason it exists.",
   payoff:"the specific skill or idea this teaches"},
  {id:"useful",  label:"Useful",     weight:20,
   line:"Point of it: solve a small real annoyance in their life, room or studies. Something that stays switched on and gets used after it's finished.",
   payoff:"the annoyance this removes"},
  {id:"fun",     label:"For fun",    weight:20,
   line:"Point of it: pure fun. It does NOT have to teach anything or be useful. It has to be satisfying to switch on — light, motion, sound, a game, a toy. Judge it on whether they'd show it to someone in the room.",
   payoff:"why it's satisfying to switch on"},
  {id:"showoff", label:"Show-off",   weight:13,
   line:"Point of it: it looks good sitting on a shelf or running on a screen. The kind of thing you hand someone and they immediately want a go. Lean into the aesthetics.",
   payoff:"the moment that lands when someone else sees it"},
  {id:"absurd",  label:"Ridiculous", weight:9,
   line:"Point of it: it's a joke. A useless machine, a wildly over-engineered answer to a non-problem, a bit taken much too far in hardware or code. Commit to it completely — do not sneak in an educational justification.",
   payoff:"the joke"}
];
const DEFAULT_KIT = "Python, C, Arduino. Breadboard, jumper wires, op-amps (LM358), LEDs, resistors, a handful of sensors, multimeter, soldering iron. No oscilloscope. 3D printer sometimes.";

const rand = a => a[Math.floor(Math.random()*a.length)];
const randInt = (lo,hi) => lo + Math.floor(Math.random()*(hi-lo+1));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const domOf = id => DOMAINS.find(d=>d.id===id) || DOMAINS[0];

/* ============================ state =========================== */
const KEY = "drop:v2";
let S = {bench:[], archive:[], kit:DEFAULT_KIT, apiKey:"", lastDomains:[]};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

let tab = "roll", order = null, rolling = null, error = "", kitOpen = false, drafts = {};

/* ========================== generation ======================== */
const SCHEMA = payoffSpec => `{
  "title": "short, concrete, max 6 words",
  "pitch": "one sentence: what the finished thing does",
  "hours": "e.g. 3-4 h",
  "payoff": "one sentence: ${payoffSpec}",
  "parts": ["max 4 items that aren't obvious"],
  "steps": ["4-5 milestones, short imperative sentences"],
  "gotcha": "one sentence: the thing that will actually eat the time",
  "stretch": ["2 extensions, one line each"]
}`;

function buildPrompt(scope, domain, difficulty, intent, avoid){
  const s = SCOPES.find(x=>x.id===scope), d = domOf(domain);
  const payoffSpec = intent.payoff;
  return `You write side-project briefs for one specific person. Output ONLY a JSON object matching this schema — no preamble, no markdown fences:

${SCHEMA(payoffSpec)}

The person: an engineering student who builds things for fun. Their kit and skills: ${S.kit}

This brief:
- Time budget: ${s.brief}. The estimate must be honest for someone working alone.
- Field: ${d.id==="wildcard" ? "your choice, but make it unexpected — something they'd never pick off a list" : d.label}.
- Difficulty ${difficulty} of 5 (1 = comfortable, 5 = they will have to learn something genuinely new to finish). Hit that level exactly.
- ${intent.line}
- It must produce a thing that exists at the end: runs, blinks, moves, prints, plays, or answers a question. Never a reading list, never "learn about X".
- Be specific. Name the actual algorithm, chip, part or method — not a category.
- No AI wrappers, no todo apps, no weather dashboards.
${avoid.length ? "- Nothing close to these, they already exist: " + avoid.join("; ") : ""}

JSON only.`;
}

async function generate(prompt){
  const payload = {model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user", content:prompt}]};
  let res;
  if (S.apiKey) {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":S.apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify(payload)
    });
  } else {
    res = await fetch("/api/generate", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt})
    });
  }
  if (!res.ok) {
    if (res.status === 401 || res.status === 403) throw new Error("The API key was rejected. Check it under \\u201cConnection\\u201d.");
    if (res.status === 429) throw new Error("Rate limited. Wait a moment and tap again.");
    throw new Error("The roll didn't land (" + res.status + "). Tap again.");
  }
  const data = await res.json();
  const text = (data.content||[]).map(c => c.type==="text" ? c.text : "").join("\n");
  const clean = text.replace(/```json/g,"").replace(/```/g,"").trim();
  return JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}")+1));
}

function pickDomain(){
  // avoid repeating either of the last two fields
  const pool = DOMAINS.filter(d => !(S.lastDomains||[]).includes(d.id));
  return rand(pool.length ? pool : DOMAINS);
}

function pickIntent(){
  const total = INTENTS.reduce((n,i)=>n+i.weight, 0);
  let r = Math.random()*total;
  for (const i of INTENTS) { r -= i.weight; if (r <= 0) return i; }
  return INTENTS[0];
}

async function roll(scopeId){
  if (!navigator.onLine) { error = "You're offline. Rolling needs a connection — the bench still works."; return render(); }
  const s = SCOPES.find(x=>x.id===scopeId);
  const domain = pickDomain();
  const intent = pickIntent();
  const difficulty = randInt(s.diff[0], s.diff[1]);
  rolling = scopeId; error = ""; order = null; render();
  try {
    const avoid = [...S.bench, ...S.archive].map(o=>o.title).slice(0,12);
    const raw = await generate(buildPrompt(scopeId, domain.id, difficulty, intent, avoid));
    order = Object.assign({}, raw, {
      id:"d"+Date.now(), domain:domain.id, domainLabel:domain.label, difficulty, scope:scopeId,
      intent:intent.id, intentLabel:intent.label
    });
    S.lastDomains = [domain.id, (S.lastDomains||[])[0]].filter(Boolean);
    save();
    if (navigator.vibrate) navigator.vibrate(18);
  } catch(e) {
    error = e.message || "That didn't come back as a project. Tap again.";
  } finally {
    rolling = null; render();
  }
}

/* ============================ views =========================== */
function cardHTML(o, full, inner){
  const d = domOf(o.domain), n = Number(o.difficulty)||3;
  const pips = [1,2,3,4,5].map(i => `<span class="${i<=n?"on":""}"></span>`).join("");
  const body = !full ? "" : `
    <div class="body">
      <p class="payoff">${esc(o.payoff)}</p>
      ${(o.parts||[]).length ? `<section><h3>You'll need</h3><ul class="parts">${o.parts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></section>` : ""}
      <section><h3>Route</h3><ol class="steps">${(o.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>
      ${o.gotcha ? `<p class="gotcha"><span>What'll bite you</span>${esc(o.gotcha)}</p>` : ""}
      ${(o.stretch||[]).length ? `<section><h3>If it goes well</h3><ul class="parts">${o.stretch.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>` : ""}
    </div>`;
  return `<article class="card" style="--accent:${d.color}">
    <div class="shine"></div>
    <div class="card-top"><div class="badges"><span class="tag">${esc(o.domainLabel||d.label)}</span>${o.intentLabel ? `<span class="flavor">${esc(o.intentLabel)}</span>` : ""}</div><span class="hours">${esc(o.hours)}</span></div>
    <h2>${esc(o.title)}</h2>
    <p class="pitch">${esc(o.pitch)}</p>
    ${body}${inner||""}
    <div class="rarity"><div class="pips">${pips}</div><p>${TIERS[n-1]}</p></div>
  </article>`;
}

function rollView(){
  if (rolling) {
    const s = SCOPES.find(x=>x.id===rolling);
    return `<div class="rolling">
      <div class="reel">${DOMAINS.map(d=>`<span style="color:${d.color}">${d.label}</span>`).join("")}</div>
      <p>Rolling ${s.label.toLowerCase()}…</p></div>`;
  }
  if (order) {
    return `<div class="reveal">${cardHTML(order, true, `<div class="actions">
      <button class="primary" data-act="keep">Take it on</button>
      <button data-act="reroll">Reroll</button>
      <button class="ghost" data-act="discard">Drop it</button>
    </div>`)}</div>`;
  }
  const hero = SCOPES[0];
  return `
    <button class="hero" data-roll="${hero.id}"><span class="glow"></span>
      <strong>${hero.label}</strong><small>Tap for tonight's build</small></button>
    <div class="grid">${SCOPES.slice(1).map(s=>`
      <button class="pill" data-roll="${s.id}"><strong>${s.label}</strong><small>${s.hint}</small></button>`).join("")}</div>
    <p class="note">Field and difficulty are rolled for you.</p>
    <button class="link" data-act="togglekit">${kitOpen ? "Hide settings" : "Your kit & connection"}</button>
    ${kitOpen ? `
      <textarea class="kit" id="kit" rows="4" placeholder="What you've got to work with">${esc(S.kit)}</textarea>
      <input class="keyin" id="apikey" type="text" placeholder="Anthropic API key — leave empty if the server holds it" value="${esc(S.apiKey)}">
    ` : ""}
    ${error ? `<p class="error">${esc(error)}</p>` : ""}`;
}

function benchView(){
  if (!S.bench.length) return `<p class="empty">Bench is clear. Go roll something.</p>`;
  return S.bench.map(p => cardHTML(p, false, `<div class="work">
    <label class="next"><span>NEXT MOVE</span>
      <input type="text" data-next="${p.id}" value="${esc(p.next||"")}" placeholder="${esc((p.steps||[])[0]||"What do you do when you sit back down?")}"></label>
    <div class="logline">
      <input type="text" data-draft="${p.id}" value="${esc(drafts[p.id]||"")}" placeholder="ADC reads fine, values jump around">
      <button data-log="${p.id}">Log</button></div>
    ${(p.log||[]).length ? `<ul class="log">${p.log.map(l=>`<li><time>${new Date(l.at).toLocaleDateString(undefined,{day:"2-digit",month:"short"})}</time>${esc(l.text)}</li>`).join("")}</ul>` : ""}
    <details class="route"><summary>Full ticket</summary>
      <ol class="steps">${(p.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      ${p.gotcha ? `<p class="gotcha"><span>What'll bite you</span>${esc(p.gotcha)}</p>` : ""}</details>
    <div class="actions">
      <button class="primary" data-close="${p.id}" data-status="done">Finished</button>
      <button class="ghost" data-close="${p.id}" data-status="parked">Park it</button></div>
  </div>`)).join("");
}

function archiveView(){
  if (!S.archive.length) return `<p class="empty">Nothing finished or parked yet.</p>`;
  return S.archive.map(p => `<div class="stub ${p.status}" style="--accent:${domOf(p.domain).color}">
    <div><h2>${esc(p.title)}</h2><p>${p.status==="done"?"Finished":"Parked"} · ${new Date(p.closedAt).toLocaleDateString()} · ${(p.log||[]).length} entries</p></div>
    <button data-revive="${p.id}">Resume</button></div>`).join("");
}

function render(){
  document.getElementById("app").innerHTML = `
    <nav class="tabs">
      <button class="${tab==="roll"?"on":""}" data-tab="roll">Roll</button>
      <button class="${tab==="bench"?"on":""}" data-tab="bench">Bench${S.bench.length?`<em>${S.bench.length}</em>`:""}</button>
      <button class="${tab==="archive"?"on":""}" data-tab="archive">Archive</button>
    </nav>
    <main>${tab==="roll" ? rollView() : tab==="bench" ? benchView() : archiveView()}</main>`;
}

/* =========================== events =========================== */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-roll],[data-act],[data-log],[data-close],[data-revive]");
  if (!t) return;
  if (t.dataset.tab)  { tab = t.dataset.tab; error = ""; return render(); }
  if (t.dataset.roll) { return roll(t.dataset.roll); }
  if (t.dataset.log)  {
    const id = t.dataset.log, text = (drafts[id]||"").trim();
    if (!text) return;
    const p = S.bench.find(x=>x.id===id);
    p.log = [{text, at:Date.now()}, ...(p.log||[])];
    drafts[id] = ""; save(); return render();
  }
  if (t.dataset.close) {
    const id = t.dataset.close, i = S.bench.findIndex(x=>x.id===id);
    if (i > -1) { S.archive.unshift(Object.assign({}, S.bench[i], {status:t.dataset.status, closedAt:Date.now()})); S.bench.splice(i,1); }
    save(); return render();
  }
  if (t.dataset.revive) {
    const id = t.dataset.revive, i = S.archive.findIndex(x=>x.id===id);
    if (i > -1) { S.bench.unshift(Object.assign({}, S.archive[i], {status:"active"})); S.archive.splice(i,1); }
    save(); tab = "bench"; return render();
  }
  const a = t.dataset.act;
  if (a === "togglekit") { kitOpen = !kitOpen; return render(); }
  if (a === "keep")     { S.bench.unshift(Object.assign({}, order, {log:[], next:"", startedAt:Date.now()})); save(); order=null; tab="bench"; return render(); }
  if (a === "reroll")   { return roll(order.scope); }
  if (a === "discard")  { order = null; return render(); }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "kit")    { S.kit = el.value; save(); }
  if (el.id === "apikey") { S.apiKey = el.value.trim(); save(); }
  if (el.dataset.next)    { const p = S.bench.find(x=>x.id===el.dataset.next); if (p) { p.next = el.value; save(); } }
  if (el.dataset.draft)   { drafts[el.dataset.draft] = el.value; }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.draft) {
    const btn = document.querySelector(`[data-log="${e.target.dataset.draft}"]`);
    if (btn) btn.click();
  }
});

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
